# Soyuz Rostov Light Realty — COMMERCIAL SourceCraft CI.
# Official trigger docs: omitting `on` defaults every workflow to push.
# Empty `paths: []` is the never-trigger sentinel, so push/PR create no
# validation runs. merge-standard and merge-risky stay manual exact-head gates.
# Production/release workflows are intentionally absent from this plan.

on:
  push:
    - workflows: [merge-standard, merge-risky]
      filter:
        paths: []

workflows:
  merge-standard:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full 40-character PR head SHA reviewed for AMS STANDARD"
    settings:
      max_cube_duration: 20m
    tasks:
      - name: exact-head-standard
        checkout:
          fetch_depth: 1
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: lint-and-layers
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                set -eu
                actual_sha="$(git rev-parse HEAD)"
                if [ "$actual_sha" != "$EXPECTED_COMMIT_SHA" ]; then
                  echo "Exact-head mismatch: actual=$actual_sha expected=$EXPECTED_COMMIT_SHA"
                  exit 1
                fi
                echo "Exact-head verified: $actual_sha"
                if grep -E 'DATABASE_URL|payload|prisma|postgres' package.json pnpm-lock.yaml >/dev/null 2>&1; then
                  echo "Database/CMS stack must not appear in REALTY_LITE dependencies."
                  exit 1
                fi
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                pnpm install --frozen-lockfile --reporter=append-only
                pnpm lint
                pnpm verify:layers

  merge-risky:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Full 40-character PR head SHA reviewed for AMS RISKY"
    settings:
      max_cube_duration: 30m
    tasks:
      - name: exact-head-risky
        checkout:
          fetch_depth: 1
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
        cubes:
          - name: lint-layers-build
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - |
                set -eu
                actual_sha="$(git rev-parse HEAD)"
                if [ "$actual_sha" != "$EXPECTED_COMMIT_SHA" ]; then
                  echo "Exact-head mismatch: actual=$actual_sha expected=$EXPECTED_COMMIT_SHA"
                  exit 1
                fi
                echo "Exact-head verified: $actual_sha"
                if grep -E 'DATABASE_URL|payload|prisma|postgres' package.json pnpm-lock.yaml >/dev/null 2>&1; then
                  echo "Database/CMS stack must not appear in REALTY_LITE dependencies."
                  exit 1
                fi
                corepack enable
                corepack prepare pnpm@12.8.1 --activate
                pnpm install --frozen-lockfile --reporter=append-only
                pnpm lint
                pnpm verify:layers
                pnpm build
